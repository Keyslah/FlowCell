name: Windows installer and program packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: FlowCellFrontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: FlowCellFrontend/src-tauri
      - name: Restore locked frontend dependencies
        working-directory: FlowCellFrontend
        run: npm ci --no-audit --no-fund
      - name: Frontend and native regression tests
        shell: pwsh
        run: |
          Push-Location FlowCellFrontend
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:button
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Pop-Location
          cargo test --locked --manifest-path FlowCellFrontend/src-tauri/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Windows updater and root-resolution tests
        shell: powershell
        run: |
          & release-tools/tests/Test-CatalogUpdater.ps1
          & release-tools/tests/Test-InstalledPaths.ps1
          & flowcellbackend/helpers/tests/Test-FlowCellPreflightManifestPaths.ps1
      - name: Program package regression tests
        shell: pwsh
        run: |
          $tests = @(git -c core.quotePath=false ls-files 'Programs/**/*.test.mjs')
          node --test @tests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $pythonTests = @(git -c core.quotePath=false ls-files 'Programs/**/test_*.py')
          foreach ($test in $pythonTests) {
            python $test
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Pinned AutoHotkey runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/dependencies -Force | Out-Null
          Invoke-WebRequest https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.2/AutoHotkey_2.0.2.zip -OutFile dist/dependencies/ahk.zip
          if ((Get-FileHash dist/dependencies/ahk.zip -Algorithm SHA256).Hash -ne '8F28C38A0B2AF6AC96C4A7E1A2C0F296B2410F845D9ACA8487843A1EDAC4271D') { throw 'AutoHotkey archive hash mismatch' }
          Expand-Archive dist/dependencies/ahk.zip dist/dependencies/ahk
      - name: Build installer and all program ZIPs
        shell: powershell
        run: |
          & release-tools/build-installer.ps1 -AutoHotkeyExe "$PWD/dist/dependencies/ahk/AutoHotkey64.exe" -AutoHotkeyLicenseFile "$PWD/dist/dependencies/ahk/license.txt"
      - name: Install, launch, upgrade, and uninstall smoke test
        shell: powershell
        run: |
          $installer = (Get-ChildItem FlowCellFrontend/src-tauri/target/release/bundle/nsis/*-setup.exe).FullName
          & release-tools/tests/Test-WindowsInstaller.ps1 -Installer $installer
      - name: Upload validated release assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-release
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
